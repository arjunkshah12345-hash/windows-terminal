[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-terminal-vm"
version = "0.3.0"
description = "A separate Windows desktop for your agents, inside your terminal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.4,<13"]
license = "MIT"

[project.optional-dependencies]
demo = ["pyte>=0.8"]

[project.scripts]
windows-terminal = "windows_terminal.cli:main"

[tool.setuptools.packages.find]
include = ["windows_terminal*"]
